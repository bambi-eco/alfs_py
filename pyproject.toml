[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfspy"]

[project]
name = "AlfsPy"
version = "3.2.0"
description = "Renderer for airborne light-field sampling data with pluggable ModernGL, PyTorch and Vulkan backends"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
]

# Version policy (see docs/MIGRATION_REVIEW.md section 5):
#   - numpy is unpinned above 1.23 and is NumPy 2.x compatible. The `numpy~=1.23.5` pin this
#     project used to carry would have blocked every torch wheel built against NumPy 2.
#   - trimesh: one side pinned 3.21.7 here while requirements.txt pinned 4.6.6. Resolved in
#     favour of a range covering both. The floor is 4.0 rather than 3.21 because trimesh 3.x
#     looks for the long-obsolete `pyembree` module and therefore silently falls back to the
#     pure-Python ray intersector even when embreex is installed -- measured at ~85x slower.
#   - No render backend is a base dependency. Install one of the extras below.
dependencies = [
    "gltflib>=1.0.13",
    "numpy>=1.23.5",
    "opencv-python>=4.7.0.72",
    "Pillow>=9.5.0",
    "pyrr>=0.10.3",
    "trimesh[easy]>=4.0,<6",
]

[project.optional-dependencies]
# Render backends. At least one is required; `moderngl` is the historical default.
moderngl = [
    "moderngl>=5.8.2",
]
# torch is deliberately given a wide floor and no ceiling. The rasteriser uses only
# long-stable primitives plus Tensor.scatter_reduce_, which sets the >=1.13 floor and is
# probed at import time by alfspy.core.torchgl.compat.
torch = [
    "torch>=1.13",
]
# The Vulkan backend, via WebGPU. This is the only part of the project that needs Python
# 3.11; everything else runs on 3.9+, which is why it is an extra rather than a base
# dependency. Its value is headless rendering: no GL driver and no Xvfb.
vulkan = [
    "wgpu>=0.32; python_version >= '3.11'",
]

# Ray casters. The default, `embree`, needs no extra: `trimesh[easy]` is a base dependency
# and already pulls embreex and rtree. This extra only pins them explicitly, as insurance
# against trimesh dropping them from `easy` -- installing it changes nothing today.
#
# It matters that embreex is present: without it trimesh silently falls back to a
# pure-Python intersector that is not merely ~85x slower but returns hits in a *different
# index order*. `EmbreeRayCaster.accelerated` reports which one is live.
embree = [
    "Rtree>=1.0",
    "embreex>=2.17; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]

# GPU ray casting via NVIDIA Warp. Worth it above roughly 1e4 rays per call; below that,
# launch and transfer overhead mean it only ties embree. Label projection casts tens of rays
# per frame, so this is for bulk work rather than the default pipeline.
warp = [
    "warp-lang>=1.0",
]

# Older names for the two above, kept so 3.0/3.1 install commands keep working. The extra
# names now match the `raycaster=` values, as the engine extras match the `engine=` values.
accel = ["AlfsPy[embree]"]
raycast-gpu = ["AlfsPy[warp]"]

# Embedded light fields: DINOv3 descriptor extraction and the reducers that make a
# 1280-channel field viewable. torch comes via the `torch` extra, which this implies --
# extraction needs it regardless of which backend renders.
embedding = [
    "torch>=1.13",
    "transformers>=4.56",
    "safetensors>=0.4",
    "scikit-learn>=1.3",
]
# UMAP is separate from `embedding`: it pulls in numba and llvmlite, which are a heavier and
# more version-sensitive install than the rest, and PCA is the default reducer.
umap = [
    "umap-learn>=0.5",
]

test = [
    "pytest>=7.0",
]

# Everything optional. Large: torch and transformers alone are a couple of GB, and umap-learn
# brings numba and llvmlite. `vulkan` carries a python_version marker, so on 3.9/3.10 it
# simply resolves to nothing rather than failing.
all = [
    "AlfsPy[moderngl]",
    "AlfsPy[torch]",
    "AlfsPy[vulkan]",
    "AlfsPy[embree]",
    "AlfsPy[warp]",
    "AlfsPy[embedding]",
    "AlfsPy[umap]",
]

# Everything plus the test dependencies: what the full suite needs to run without skipping.
dev = [
    "AlfsPy[all]",
    "AlfsPy[test]",
]

[project.scripts]
alfs = "alfspy.cli:main"

[tool.pytest.ini_options]
# Collect only from test/. The package tree contains developer scratch scripts whose names
# would otherwise be picked up.
testpaths = ["test"]
# Both the repo root (for `test.helpers`) and `src` (for `alfspy`), so the suite runs
# without the package being installed.
pythonpath = [".", "src"]
markers = [
    "slow: end-to-end renders at production-like resolutions",
    "cuda: requires a CUDA device",
    "gl: requires a working OpenGL context",
    "parity: compares against a reference ModernGL install (needs ALFS_REFERENCE_PATH)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyrr.*",
    "ignore::DeprecationWarning:trimesh.*",
]
